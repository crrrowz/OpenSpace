[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:openspace-mcp]
command=openspace-mcp --transport sse --host 0.0.0.0 --port 8080
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:openspace-dashboard]
command=python -m openspace.entrypoints.dashboard.server --host 0.0.0.0 --port 7788 --db-path /app/.openspace/skills.db --evidence-db-path /app/.openspace/evidence.db
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
